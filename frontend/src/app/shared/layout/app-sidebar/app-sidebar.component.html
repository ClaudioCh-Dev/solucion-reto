<aside
  class="fixed flex flex-col top-0 px-5 start-0 bg-white dark:bg-gray-900 dark:border-gray-800 text-gray-900 h-screen transition-all duration-300 ease-in-out z-50 border-e border-gray-200 xl:translate-x-0"
  [class]="{
    'w-[290px]': sidebar.isWide(),
    'w-[90px]': !sidebar.isWide(),
    'translate-x-0': sidebar.isMobileOpen(),
    'max-xl:-translate-x-full': !sidebar.isMobileOpen(),
    'max-xl:rtl:translate-x-full': !sidebar.isMobileOpen()
  }"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="sidebar.isHovered.set(false)"
>
  <div class="py-8 flex" [class]="sidebar.isWide() ? 'justify-start' : 'xl:justify-center'">
    <a routerLink="/" aria-label="Quality Products · inicio">
      <app-brand-logo [compact]="!sidebar.isWide()" />
    </a>
  </div>

  <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
    <nav class="mb-6">
      <div class="flex flex-col gap-4">
        <div>
          <h2
            class="mb-4 text-xs uppercase flex leading-[20px] text-gray-400"
            [class]="sidebar.isWide() ? 'justify-start' : 'xl:justify-center'"
          >
            @if (sidebar.isWide()) {
              Catálogo
            } @else {
              <svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="size-6">
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M5.99915 10.2451C6.96564 10.2451 7.74915 11.0286 7.74915 11.9951V12.0051C7.74915 12.9716 6.96564 13.7551 5.99915 13.7551C5.03265 13.7551 4.24915 12.9716 4.24915 12.0051V11.9951C4.24915 11.0286 5.03265 10.2451 5.99915 10.2451ZM17.9991 10.2451C18.9656 10.2451 19.7491 11.0286 19.7491 11.9951V12.0051C19.7491 12.9716 18.9656 13.7551 17.9991 13.7551C17.0326 13.7551 16.2491 12.9716 16.2491 12.0051V11.9951C16.2491 11.0286 17.0326 10.2451 17.9991 10.2451ZM13.7491 11.9951C13.7491 11.0286 12.9656 10.2451 11.9991 10.2451C11.0326 10.2451 10.2491 11.0286 10.2491 11.9951V12.0051C10.2491 12.9716 11.0326 13.7551 11.9991 13.7551C12.9656 13.7551 13.7491 12.9716 13.7491 12.0051V11.9951Z"
                  fill="currentColor"
                ></path>
              </svg>
            }
          </h2>
          <ul class="flex flex-col gap-1">
            @for (nav of navItems; track nav.path) {
              <li>
                <a
                  [routerLink]="nav.path"
                  routerLinkActive="menu-item-active"
                  #rla="routerLinkActive"
                  class="menu-item group"
                  [class.menu-item-inactive]="!rla.isActive"
                  [class]="sidebar.isWide() ? 'xl:justify-start' : 'xl:justify-center'"
                  (click)="onNavigate()"
                >
                  <span
                    class="menu-item-icon-size"
                    [class]="rla.isActive ? 'menu-item-icon-active' : 'menu-item-icon-inactive'"
                    [innerHTML]="nav.icon | safeHtml"
                  ></span>
                  @if (sidebar.isWide()) {
                    <span class="menu-item-text">{{ nav.name }}</span>
                  }
                </a>
              </li>
            }
          </ul>
        </div>
      </div>
    </nav>
  </div>
</aside>
