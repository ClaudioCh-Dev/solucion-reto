<div class="rounded-xl border p-4" [class]="classes().container" role="alert">
  <div class="flex items-start gap-3">
    <div class="-mt-0.5" [class]="classes().icon" [innerHTML]="iconSvg() | safeHtml"></div>

    <div class="flex-1">
      @if (title()) {
        <h4 class="mb-1 text-sm font-semibold text-gray-800 dark:text-white/90">{{ title() }}</h4>
      }
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ message() }}</p>
      <ng-content></ng-content>
    </div>
  </div>
</div>
