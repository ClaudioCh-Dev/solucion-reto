<div class="relative">
  <select
    [id]="id()"
    [class]="selectClasses()"
    [disabled]="disabled()"
    [attr.aria-invalid]="showError()"
    (change)="onChange($event)"
    (blur)="touch.emit()"
  >
    <!-- Placeholder option -->
    <option value="" disabled [selected]="!value()" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
      {{ placeholder() }}
    </option>
    @for (option of options(); track option.value) {
      <option
        [value]="option.value"
        [selected]="option.value === value()"
        class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
      >
        {{ option.label }}
      </option>
    }
  </select>
  <!-- Dropdown caret icon -->
  <svg
    class="absolute text-gray-700 dark:text-gray-400 end-3 top-1/2 -translate-y-1/2 pointer-events-none"
    width="20"
    height="20"
    viewBox="0 0 20 20"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M4.79175 8.02075L10.0001 13.2291L15.2084 8.02075"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</div>
