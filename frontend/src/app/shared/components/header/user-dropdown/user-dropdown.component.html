<div class="relative">
  <!-- User Button -->
  <button
    type="button"
    class="flex items-center text-gray-700 dropdown-toggle dark:text-gray-400"
    (click)="toggleDropdown($event)"
    [attr.aria-expanded]="isOpen()"
  >
    <span class="overflow-hidden rounded-full me-3 h-11 w-11 shrink-0">
      <span class="flex items-center justify-center w-full h-full font-semibold text-white bg-brand-500">{{ initials() }}</span>
    </span>

    <span class="block font-medium me-1 text-theme-sm">{{ userName() }}</span>

    <!-- Chevron Icon -->
    <svg
      class="transition-transform duration-200 size-5 text-gray-500 dark:text-gray-400"
      [class.rotate-180]="isOpen()"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  <!-- Dropdown Start -->
  @if (isOpen()) {
    <div
      class="absolute end-0 mt-[17px] flex w-[260px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark z-50 animate-fadeIn"
    >
      <!-- User Info -->
      <div class="pb-3 border-b border-gray-200 dark:border-gray-800">
        <span class="block font-medium text-gray-700 text-theme-sm dark:text-gray-400">{{ userName() }}</span>
        <span class="mt-0.5 block text-theme-xs text-gray-500 dark:text-gray-400">{{ auth.email() }}</span>
      </div>

      <button
        type="button"
        (click)="logout()"
        class="group mt-3 flex w-full items-center justify-center gap-3 rounded-lg border border-gray-200 px-3 py-2 text-theme-sm font-medium text-gray-700 hover:bg-gray-100 hover:text-gray-700 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        Cerrar sesión
      </button>
    </div>
  }
</div>
