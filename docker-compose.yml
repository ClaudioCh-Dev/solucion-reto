# Solo para desarrollo local. Producción usa un SQL Server externo.
# Las contraseñas son de desarrollo; no usar en producción.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: entrevista-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Entrevista#2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Se ejecuta una vez cuando SQL Server está listo: crea la base y el usuario de la app.
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Entrevista#2026"
      APP_DB: "EntrevistaDb_Dev"
      APP_USER: "entrevista_app"
      APP_PASSWORD: "EntrevistaApp#2026"
    volumes:
      - ./docker/sqlserver/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -i /init.sql"]
    restart: "no"

volumes:
  sqlserver-data:
